# Find out how www.fda.gov answers a GitHub Actions runner.
#
# Why this workflow exists
# ------------------------
# On 2026-09-01 the first real refresh run on a runner (run 33539857201) wrote
# `data/meta.json` with FDA RSS `reachable: false`, note `HTTP 404`, count 0 —
# while the identical URL returned 200, `application/rss+xml`, 18,541 bytes from
# the author's laptop minutes later. openFDA (40 rows) and FSIS (7) answered the
# same runner normally, so this is specific to www.fda.gov, not to the runner's
# network in general.
#
# That is the same shape as the FSIS problem: works locally, blocked from CI.
# It is also the more expensive one. RSS is the only entrance to the `extracted`
# confidence tier, and it is the *freshest* tier — openFDA's report_date lags
# recall initiation by a median of 69 days. Losing RSS silently drops every
# recent press-release recall while the page still renders and looks complete.
#
# What is NOT yet known, and what this exists to settle
# -----------------------------------------------------
# A 404 is not a 403. FSIS refused with 403 and a TLS fingerprint was the proven
# cause; a 404 could equally be an edge/CDN rule serving "not found" to
# datacenter egress, a region-specific response, or something transient that has
# already healed. Guessing between those and "fixing" the wrong one is how a
# silent failure gets a confident, useless patch bolted onto it.
#
# So this probe changes no production code. It reports what a runner actually
# gets, for both www.fda.gov paths the pipeline depends on:
#
#   the feed          scripts/sources/fdaRss.ts  — plain fetch() today
#   a press release   scripts/pressRelease.ts    — plain fetch() today
#
# Both legs are run twice, once with plain fetch() and once with impit, because
# the whole question is whether swapping transports is the fix. If impit gets
# through where fetch does not, the fix is the FSIS fix. If both 404, the
# transport is innocent and the cause is elsewhere — do not touch the transport.
#
# Diagnostic, not a gate. Nothing here fails the job: a red run would imply this
# workflow knows what the correct answer is, and it does not. Read the output.
name: FDA reachability probe

on:
  # Manual only. It answers a question that needs asking when something looks
  # wrong, and it hits a government server; there is no reason to schedule it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe www.fda.gov from a runner
    runs-on: ubuntu-latest
    # A blocked request may hang rather than refuse. This normally finishes in
    # well under a minute; ten bounds the pathological case.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Even (LTS) release, matching static.yml and fsis-probe.yml. See
      # CLAUDE.md, "Verified environment constraints".
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # impit is already a production dependency. No GEMINI_API_KEY: this probe
      # touches no model, and the point is to isolate the network question.
      - name: Install dependencies
        run: npm ci

      # Written inline rather than under scripts/, for the same reason
      # fsis-probe.yml does it: scripts/ is production pipeline code, bound by
      # erasableSyntaxOnly and covered by the test suite. A diagnostic is not.
      - name: Write probe
        run: |
          cat > fda-probe.ts <<'PROBE'
          import { Impit } from 'impit';
          import { FEED_URL, parser } from './scripts/sources/fdaRss.ts';
          import { FdaRssFeed } from './scripts/sourceSchemas.ts';

          function line(k: string, v: unknown) {
            console.log(`    ${k.padEnd(18)} ${String(v)}`);
          }

          const impit = new Impit({ browser: 'chrome' });

          /** Reports one URL over one transport. Never throws. */
          async function probe(label: string, url: string, useImpit: boolean) {
            console.log(`\n  ${label}`);
            try {
              const res = useImpit ? await impit.fetch(url) : await fetch(url);
              const body = await res.text();
              const ct = res.headers.get('content-type') ?? '';
              line('http status', res.status);
              line('content-type', ct || '(none)');
              line('bytes', body.length.toLocaleString());
              // A 404 HTML error page deserialises to garbage rather than
              // throwing, so status alone is not the answer — show the shape.
              line('looks like', /^\s*<\?xml|<rss/i.test(body) ? 'XML/RSS' : /<html/i.test(body) ? 'HTML (error page?)' : 'neither');
              if (!res.ok) line('first 200', JSON.stringify(body.slice(0, 200)));
              return { ok: res.ok, body, ct };
            } catch (e) {
              line('request', `THREW: ${(e as Error).message}`);
              return null;
            }
          }

          console.log(`\n=== FDA reachability probe`);
          console.log(`=== feed: ${FEED_URL}`);

          console.log('\n[1/2] THE FEED');
          const fetchFeed = await probe('a. plain fetch() — what production uses today', FEED_URL, false);
          const impitFeed = await probe('b. impit — the FSIS transport', FEED_URL, true);

          // Take a real press-release URL from whichever leg produced a feed, so
          // leg 2 tests a live announcement rather than a guessed URL.
          let article: string | null = null;
          for (const r of [impitFeed, fetchFeed]) {
            if (!r?.ok || !/xml/i.test(r.ct)) continue;
            const p = FdaRssFeed.safeParse(parser.parse(r.body));
            if (p.success && p.data.rss.channel.item.length > 0) {
              article = p.data.rss.channel.item[0]!.link;
              break;
            }
          }

          console.log('\n[2/2] A PRESS RELEASE (scripts/pressRelease.ts path)');
          if (article === null) {
            console.log('    SKIPPED — no leg returned a parseable feed, so there is no');
            console.log('    announcement URL to try. That is itself the finding.');
          } else {
            console.log(`    url: ${article}`);
            await probe('a. plain fetch() — what production uses today', article, false);
            await probe('b. impit', article, true);
          }

          console.log('\n=== how to read this');
          console.log('impit through, fetch blocked  -> swap the transport; this is the FSIS fix.');
          console.log('both blocked                  -> transport is innocent. Do NOT swap it.');
          console.log('both fine                     -> the 404 was transient. Record it, change nothing,');
          console.log('                                 and note the source can vanish without warning.');
          PROBE

      # node runs TypeScript directly via native type stripping — no build step.
      - name: Run probe
        run: node fda-probe.ts
