# Build, verify, and deploy the static site to GitHub Pages.
#
# The deploy job is gated on the build job, and the build job runs `check` and
# `test` before `astro build`. A page that is wrong about food recalls is worse
# than a page that is a few minutes stale, so a type error or a failing test
# must stop the deployment rather than ship past it.
name: Deploy Astro site to Pages

on:
  # Runs on pushes targeting the default branch — including the commits the
  # data refresh workflow makes to data/recalls.json.
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json declares node >=22.12.0. Pin an even (LTS) release: the
      # local machine runs an odd release, which works but is not a supported
      # line. See CLAUDE.md, "Verified environment constraints".
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Type-check first: it is the cheapest failure and catches a malformed
      # Recall shape before the tests spend time on it.
      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test

      # index.astro parses data/recalls.json through the Zod schema at build
      # time, so a corrupt data commit fails here rather than deploying.
      - name: Build with Astro
        run: |
          npx --no-install astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"

      # GEMINI_API_KEY is only ever used by the refresh workflow, never at build
      # time, and must never carry a PUBLIC_ prefix. Fail loudly if it leaks.
      - name: Assert no API key in the bundle
        run: |
          if grep -rlE 'AIza[0-9A-Za-z_-]{10,}|GEMINI_API_KEY' dist/; then
            echo "::error::A credential-shaped string reached dist/"
            exit 1
          fi
          echo "dist/ is clean"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
