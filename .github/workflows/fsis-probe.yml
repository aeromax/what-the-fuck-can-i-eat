# Prove that USDA FSIS is reachable from a GitHub Actions runner.
#
# Why this workflow exists
# ------------------------
# FSIS covers meat, poultry and eggs — the categories openFDA does not carry.
# It has only ever been proven reachable from the author's laptop. A runner has
# different egress and different IP reputation, and www.fsis.usda.gov is known
# to block by TLS fingerprint: on 2026-08-29 plain fetch() got HTTP 403 on FSIS
# HTML pages while the API endpoint answered 200, so the block is real and
# path-dependent rather than gone. `impit` got through both, which is why it is
# a dependency.
#
# The failure this guards against is the silent one. If FSIS is blocked in CI,
# meat and poultry recalls simply vanish while the page still looks complete —
# the exact outcome CLAUDE.md calls unacceptable. This workflow turns that
# invisible failure into a red run you can trigger on demand.
#
# It is a diagnostic, not a gate: keep it. The day the page mysteriously loses
# every meat recall, this is the first thing to run.
#
# IMPORTANT — this probe informs, it does not license a simplification.
# Per CLAUDE.md ("Traps → FSIS"), the pipeline keeps using `impit` regardless of
# what the plain-fetch leg reports here. An intermittent block is worse than a
# permanent one, and the dependency is already paid for. A green plain-fetch leg
# is a data point about today, not permission to delete impit.
name: FSIS reachability probe

on:
  # Manual only, deliberately. This is not a gate on push and not a schedule:
  # it downloads ~12.9 MB from a government endpoint and answers a question that
  # only needs asking when something is suspicious (or before shipping CI).
  # The scheduled data refresh lives in its own workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe FSIS from a runner
    runs-on: ubuntu-latest
    # The payload is ~12.9 MB of JSON and the endpoint can be slow; a blocked
    # request may also hang rather than refuse. Ten minutes is generous for a
    # run that normally takes well under a minute, and bounds a hang.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json declares node >=22.12.0. Pin an even (LTS) release, matching
      # static.yml: the local machine runs an odd release, which works but is not
      # a supported line. See CLAUDE.md, "Verified environment constraints".
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # impit is a production dependency, so a plain `npm ci` is all the probe
      # needs. No GEMINI_API_KEY: this probe touches no model, and the whole
      # point is to isolate the network question from everything else.
      - name: Install dependencies
        run: npm ci

      # Written inline rather than committed under scripts/: scripts/ is
      # production pipeline code, constrained by erasableSyntaxOnly and covered
      # by the test suite. A diagnostic does not belong there, and this file
      # is not part of the shipped repo — it is created in the runner's
      # workspace and thrown away with it.
      - name: Write probe
        run: |
          cat > fsis-probe.ts <<'PROBE'
          // Two legs, deliberately asymmetric.
          //
          //   impit  — the production path. It calls the project's real
          //            fetchFsis(), because a probe that tests a
          //            reimplementation proves nothing about production.
          //            A raw impit request runs alongside it purely to expose
          //            the numbers fetchFsis does not return (status,
          //            content-type, byte size).
          //   fetch  — the control. Historically blocked; a failure here is the
          //            expected result and vindicates keeping impit.
          import { Impit } from 'impit';
          import { FSIS_API, fetchFsis, selectRecords } from './scripts/sources/fsis.ts';
          import { FsisResponse } from './scripts/sourceSchemas.ts';

          function line(k: string, v: unknown) {
            console.log(`    ${k.padEnd(20)} ${String(v)}`);
          }

          // Never print the body. It is 12.9 MB and would bury the finding.
          function describe(status: number, contentType: string, body: string) {
            line('http status', status);
            line('content-type', contentType || '(none)');
            line('bytes', body.length.toLocaleString());

            let json: unknown;
            try {
              json = JSON.parse(body);
            } catch {
              line('parsed records', 'JSON PARSE FAILED — not a JSON body');
              line('first 200 chars', JSON.stringify(body.slice(0, 200)));
              return false;
            }

            const parsed = FsisResponse.safeParse(json);
            if (!parsed.success) {
              line('parsed records', `SCHEMA REJECTED: ${parsed.error.message.slice(0, 300)}`);
              return false;
            }

            line('parsed records', parsed.data.length);
            // "200 OK with zero usable records" is the more insidious failure:
            // the request looks fine and the page still loses every meat recall.
            line('after inclusion rule', selectRecords(parsed.data).length);
            return true;
          }

          let impitOk = false;
          console.log(`\n=== FSIS reachability probe — ${FSIS_API}\n`);

          console.log('[1/3] impit, raw request (diagnostics only)');
          try {
            const res = await new Impit({ browser: 'chrome' }).fetch(FSIS_API);
            const body = await res.text();
            line('request', 'succeeded');
            describe(res.status, res.headers.get('content-type') ?? '', body);
          } catch (e) {
            line('request', `FAILED: ${(e as Error).message}`);
          }

          console.log('\n[2/3] impit, via the real fetchFsis() — THE PRODUCTION PATH');
          try {
            const r = await fetchFsis();
            line('request', r.reachable ? 'succeeded' : 'FAILED');
            line('reachable', r.reachable);
            line('note', r.note);
            line('recalls published', r.recalls.length);
            // Reachable-but-empty is not a pass: it is the silent failure mode.
            impitOk = r.reachable && r.recalls.length > 0;
          } catch (e) {
            line('request', `THREW: ${(e as Error).message}`);
          }

          console.log('\n[3/3] plain fetch() — the control, historically blocked');
          try {
            const res = await fetch(FSIS_API);
            const body = await res.text();
            line('request', res.ok ? 'succeeded' : `HTTP ${res.status}`);
            describe(res.status, res.headers.get('content-type') ?? '', body);
          } catch (e) {
            line('request', `FAILED: ${(e as Error).message}`);
          }

          console.log('\n=== verdict');
          if (impitOk) {
            console.log('impit leg PASSED — FSIS is reachable from this runner.');
          } else {
            // Only the impit leg can fail the job. A failing plain-fetch leg is
            // the expected historical behaviour and is reported, not enforced:
            // it is evidence FOR the current design, not a defect.
            console.log('::error::impit leg FAILED — FSIS is not usable from this runner.');
            console.log('Meat, poultry and egg recalls would silently vanish from the page.');
            console.log('Per docs/build-plan.md step 5: stop and raise it. The fallbacks are a');
            console.log('product decision, not an implementation detail.');
            process.exit(1);
          }
          PROBE

      # `node` runs TypeScript directly via native type stripping — same as
      # `npm run refresh`. There is no build step for the pipeline.
      - name: Run probe
        run: node fsis-probe.ts
